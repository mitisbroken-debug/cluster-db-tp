services:
  db-test:
    image: postgres:16
    container_name: db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: aplicacion
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-test-data:/var/lib/postgresql/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://aplicacion:test1234@db-test:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db-test
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

    
  node1:
    image: bitnami/postgresql:16
    container_name: node1
    restart: unless-stopped
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${REPL_PASSWORD}
      POSTGRESQL_USERNAME: aplicacion
      POSTGRESQL_PASSWORD: ${NODE_PASSWORD}
      POSTGRESQL_DATABASE: clusterdb
    ports:
      - "5433:5432"
    volumes:
      - node1-data:/bitnami/postgresql

  node2:
    image: bitnami/postgresql:16
    container_name: node2
    restart: unless-stopped
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${REPL_PASSWORD}
      POSTGRESQL_MASTER_HOST: node1
      POSTGRESQL_PASSWORD: ${NODE_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - node2-data:/bitnami/postgresql
    depends_on:
      - node1

  node3:
    image: bitnami/postgresql:16
    container_name: node3
    restart: unless-stopped
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${REPL_PASSWORD}
      POSTGRESQL_MASTER_HOST: node1
      POSTGRESQL_PASSWORD: ${NODE_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - node3-data:/bitnami/postgresql
    depends_on:
      - node1

volumes:
  db-test-data:
  grafana-data:
  node1-data:
  node2-data:
  node3-data:
services:
  node1:
    image: postgres:16
    container_name: node1
    restart: unless-stopped
    environment:
      POSTGRES_USER: administrador
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: clusterdb
      REPL_PASSWORD: ${REPL_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
      NODE_PASSWORD: ${NODE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - node1-data:/var/lib/postgresql/data
      - ./config/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"

  node2:
    image: postgres:16
    container_name: node2
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      REPL_PASSWORD: ${REPL_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - node2-data:/var/lib/postgresql/data
      - ./config/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/init-replica.sh"]
    depends_on:
      - node1

  node3:
    image: postgres:16
    container_name: node3
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      REPL_PASSWORD: ${REPL_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - node3-data:/var/lib/postgresql/data
      - ./config/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/init-replica.sh"]
    depends_on:
      - node1

  proxy:
    image: haproxy:2.9
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "5436:5433"
    depends_on:
      - node1
      - node2
      - node3

  postgres-exporter-node1:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-node1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitorizacion:${MONITOR_PASSWORD}@node1:5432/clusterdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - node1

  postgres-exporter-node2:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-node2
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitorizacion:${MONITOR_PASSWORD}@node2:5432/clusterdb?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      - node2

  postgres-exporter-node3:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-node3
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://monitorizacion:${MONITOR_PASSWORD}@node3:5432/clusterdb?sslmode=disable"
    ports:
      - "9189:9187"
    depends_on:
      - node3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter-node1
      - postgres-exporter-node2
      - postgres-exporter-node3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  node1-data:
  node2-data:
  node3-data:
  grafana-data: